<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="تحدي الأعلام">
<title>تحدي الأعلام</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--tx:#1d2330;--mut:#6b7385;--ac:#e8590c;--ok:#2f9e44;--no:#e03131;--bd:#e2ddd2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--card:#1f2430;--tx:#f1f3f8;--mut:#9aa3b8;--ac:#ff8a3d;--ok:#51cf66;--no:#ff6b6b;--bd:#323949;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171f;--card:#1f2430;--tx:#f1f3f8;--mut:#9aa3b8;--ac:#ff8a3d;--ok:#51cf66;--no:#ff6b6b;--bd:#323949;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh}
#app{max-width:480px;margin:0 auto;padding:16px}
h1{text-align:center;margin:8px 0 4px;font-size:28px}
.sub{text-align:center;color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
textarea{width:100%;height:90px;font:inherit;font-size:12px;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);direction:ltr;margin:6px 0}
input,select{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin:6px 0}
button{font:inherit;font-weight:600;width:100%;padding:14px;border-radius:12px;border:0;background:var(--ac);color:#fff;margin:6px 0;cursor:pointer}
button.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.5}
.row{display:flex;gap:8px}.row>*{flex:1}
.sc{display:flex;justify-content:space-between;gap:8px}
.pl{flex:1;text-align:center;padding:8px;border-radius:12px;background:var(--bg);border:2px solid transparent}
.pl.me{border-color:var(--ac)}.pl b{display:block;font-size:26px}
.flag{font-size:110px;text-align:center;line-height:1.2;margin:8px 0}
.info{display:flex;justify-content:space-between;color:var(--mut);font-size:14px}
.opt{background:var(--card);color:var(--tx);border:2px solid var(--bd);font-size:17px}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.no{background:var(--no);color:#fff;border-color:var(--no)}
.opt.pk{border-color:var(--ac)}
.code{font-size:44px;letter-spacing:8px;text-align:center;font-weight:800;direction:ltr}
.c{text-align:center}.mut{color:var(--mut)}
.big{font-size:26px;font-weight:800;text-align:center;margin:8px 0}
.err{color:var(--no);text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script>
const LIST="IQ:العراق,SA:السعودية,EG:مصر,JO:الأردن,LB:لبنان,SY:سوريا,PS:فلسطين,KW:الكويت,QA:قطر,AE:الإمارات,OM:عُمان,BH:البحرين,YE:اليمن,LY:ليبيا,TN:تونس,DZ:الجزائر,MA:المغرب,SD:السودان,TR:تركيا,IR:إيران,US:أمريكا,GB:بريطانيا,FR:فرنسا,DE:ألمانيا,IT:إيطاليا,ES:إسبانيا,PT:البرتغال,NL:هولندا,BE:بلجيكا,CH:سويسرا,SE:السويد,NO:النرويج,DK:الدنمارك,FI:فنلندا,RU:روسيا,UA:أوكرانيا,PL:بولندا,GR:اليونان,JP:اليابان,CN:الصين,KR:كوريا الجنوبية,IN:الهند,PK:باكستان,AF:أفغانستان,BD:بنغلاديش,ID:إندونيسيا,MY:ماليزيا,TH:تايلند,VN:فيتنام,PH:الفلبين,AU:أستراليا,NZ:نيوزيلندا,CA:كندا,MX:المكسيك,BR:البرازيل,AR:الأرجنتين,CL:تشيلي,CO:كولومبيا,PE:بيرو,VE:فنزويلا,CU:كوبا,ZA:جنوب أفريقيا,NG:نيجيريا,KE:كينيا,ET:إثيوبيا,GH:غانا,SN:السنغال,SO:الصومال".split(",").map(s=>s.split(":"));
"AD:أندورا,AG:أنتيغوا وباربودا,AL:ألبانيا,AM:أرمينيا,AO:أنغولا,AT:النمسا,AZ:أذربيجان,BA:البوسنة والهرسك,BB:باربادوس,BF:بوركينا فاسو,BG:بلغاريا,BI:بوروندي,BJ:بنين,BN:بروناي,BO:بوليفيا,BS:جزر البهاما,BT:بوتان,BW:بوتسوانا,BY:بيلاروسيا,BZ:بليز,CD:الكونغو الديمقراطية,CF:أفريقيا الوسطى,CG:الكونغو,CI:ساحل العاج,CM:الكاميرون,CV:الرأس الأخضر,CY:قبرص,CZ:التشيك,DJ:جيبوتي,DM:دومينيكا,DO:جمهورية الدومينيكان,EC:الإكوادور,EE:إستونيا,ER:إريتريا,FJ:فيجي,FM:ميكرونيزيا,GA:الغابون,GD:غرينادا,GE:جورجيا,GM:غامبيا,GN:غينيا,GQ:غينيا الاستوائية,GT:غواتيمالا,GW:غينيا بيساو,GY:غيانا,HN:هندوراس,HR:كرواتيا,HT:هايتي,HU:المجر,IE:أيرلندا,IS:آيسلندا,JM:جامايكا,KG:قيرغيزستان,KH:كمبوديا,KI:كيريباتي,KM:جزر القمر,KN:سانت كيتس ونيفيس,KZ:كازاخستان,LA:لاوس,LC:سانت لوسيا,LI:ليختنشتاين,LK:سريلانكا,LR:ليبيريا,LS:ليسوتو,LT:ليتوانيا,LU:لوكسمبورغ,LV:لاتفيا,MC:موناكو,MD:مولدوفا,ME:الجبل الأسود,MG:مدغشقر,MH:جزر مارشال,MK:مقدونيا الشمالية,ML:مالي,MM:ميانمار,MN:منغوليا,MR:موريتانيا,MT:مالطا,MU:موريشيوس,MV:المالديف,MW:ملاوي,MZ:موزمبيق,NA:ناميبيا,NE:النيجر,NI:نيكاراغوا,NP:نيبال,NR:ناورو,PA:بنما,PG:بابوا غينيا الجديدة,PW:بالاو,PY:باراغواي,RO:رومانيا,RS:صربيا,RW:رواندا,SB:جزر سليمان,SC:سيشل,SG:سنغافورة,SI:سلوفينيا,SK:سلوفاكيا,SL:سيراليون,SM:سان مارينو,SR:سورينام,SS:جنوب السودان,ST:ساو تومي وبرينسيبي,SV:السلفادور,SZ:إسواتيني,TD:تشاد,TG:توغو,TJ:طاجيكستان,TL:تيمور الشرقية,TM:تركمانستان,TO:تونغا,TT:ترينيداد وتوباغو,TV:توفالو,TZ:تنزانيا,UG:أوغندا,UY:الأوروغواي,UZ:أوزبكستان,VC:سانت فنسنت والغرينادين,VU:فانواتو,WS:ساموا,XK:كوسوفو,ZM:زامبيا,ZW:زيمبابوي".split(",").map(s=>s.split(":")).forEach(x=>{if(!LIST.some(y=>y[0]===x[0]))LIST.push(x)});
const NAME=Object.fromEntries(LIST);
const CODES=LIST.map(x=>x[0]);
const FAM="IQ SA EG JO LB SY PS KW QA AE TR IR US GB FR DE IT ES PT NL BE CH SE RU JP CN KR IN BR AR MX CA AU".split(" ");
const QC=CODES.filter(c=>!FAM.includes(c));
const GR=[["ID","MC","PL","SG"],["RO","TD","AD","MD"],["AU","NZ","FJ","TV"],["NL","LU","HR","PY"],["SK","SI","RU","RS"],["SN","ML","GN","GH","CM"],["CO","EC","VE"],["GT","HN","SV","NI"],["AT","LV","PE","LB"],["CI","IE","IT","MX"],["DM","GD","LC","VC"],["TJ","KG","UZ","TM"],["BF","ST","GW","MZ"],["SD","YE","EG","SY"]];
let exitT=0;
function exitTap(){if(!S)return;if(S.ph==="lobby"||Date.now()-exitT<3000){exitT=0;leave()}else{exitT=Date.now();draw();setTimeout(()=>{if(S)draw()},3100)}}
const fl=c=>String.fromCodePoint(...[...c].map(ch=>127397+ch.charCodeAt(0)));
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const $=document.getElementById("app");
const TIME=12;
let role=null,room=null,S=null,myPick=null,lastRound=0,A={},T0=0,tick=null,used=[],msg="",myName="",solo=false,guestPeer=null,helloT=null,bcT=null;

function menu(){
  S=null;role=null;solo=false;
  $.innerHTML=`<h1>🚩 تحدي الأعلام</h1><p class="sub">شنو اسم هذا العلم؟</p>
  <div class="card"><input id="nm" placeholder="اسمك" maxlength="14" value="${esc(myName)}">
  <div class="mut" style="margin-top:6px">شرط الفوز (انت تحدد)</div><div class="row"><select id="md" onchange="document.getElementById('tg').value=this.value==='pts'?50:10"><option value="pts">أول واحد يوصل نقاط</option><option value="rd">عدد محاولات</option></select><input id="tg" type="number" inputmode="numeric" min="1" max="1000" value="50"></div>
  <button onclick="startSolo()">لعب فردي</button>
  <button onclick="hostGame()">أفتح سيرفر وأتحدى صديقي</button></div>
  <div class="card"><div class="c mut">وصلك رابط أو كود من صديقك؟</div><textarea id="oc" placeholder="الصق الرابط أو الكود هنا">${esc((location.hash.match(/o=([A-Za-z0-9_-]+)/)||["",""])[1])}</textarea><button class="alt" onclick="joinGame()">أدخل السيرفر</button></div>
  <div class="err">${esc(msg)}</div>`;
}
function getCfg(){
  myName=(document.getElementById("nm").value||"").trim()||"لاعب";
  const m=document.getElementById("md").value;let t=parseInt(document.getElementById("tg").value);if(!(t>0))t=m==="pts"?50:10;t=Math.min(t,m==="pts"?1000:200);return {mode:m,target:t};
}
function base(cfg){return {ph:"lobby",mode:cfg.mode,target:cfg.target,round:0,left:TIME,q:null,P:{h:{name:myName,score:0}},ans:{},res:null,winner:null}}
function startSolo(){const cfg=getCfg();solo=true;role="h";S=base(cfg);used=[];nextQ()}
let pc=null,dc=null,offerLink="",ansTxt="",netMsg="";
const ICE={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]};
const u8=b=>btoa(String.fromCharCode(...b)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const fromU8=t=>{t=t.replace(/-/g,"+").replace(/_/g,"/");while(t.length%4)t+="=";return Uint8Array.from(atob(t),c=>c.charCodeAt(0))};
async function enc(o){const t=JSON.stringify(o);if(window.CompressionStream){const r=new Blob([t]).stream().pipeThrough(new CompressionStream("gzip"));return "z"+u8(new Uint8Array(await new Response(r).arrayBuffer()))}return "p"+u8(new TextEncoder().encode(t))}
async function dec(t){const b=fromU8(t.slice(1));if(t[0]==="z"){const r=new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip"));return JSON.parse(await new Response(r).text())}return JSON.parse(new TextDecoder().decode(b))}
function ice(c){return new Promise(r=>{if(c.iceGatheringState==="complete")return r();const f=()=>{if(c.iceGatheringState==="complete"){c.removeEventListener("icegatheringstatechange",f);r()}};c.addEventListener("icegatheringstatechange",f);setTimeout(r,5000)})}
function send(t,d){if(dc&&dc.readyState==="open")dc.send(JSON.stringify({t,d}))}
function bc(){if(role==="h")send("state",S)}
function wire(){
  dc.onopen=()=>{netMsg="تم الاتصال ✅";if(role==="g")send("hello",{name:myName});draw();if(!S&&role==="g")guestScreen()};
  dc.onclose=()=>{netMsg="انقطع الاتصال";if(S&&S.ph!=="e")draw()};
  dc.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}onMsg(m)};
}
function onMsg(m){
  if(!m||typeof m!=="object")return;
  if(role==="h"){
    if(m.t==="hello"){const n=String((m.d&&m.d.name)||"لاعب").slice(0,14);S.P.g={name:n,score:(S.P.g||{}).score||0};bc();draw()}
    else if(m.t==="ans"&&m.d)onAns("g",String(m.d.c),m.d.r);
  }else if(m.t==="state"&&m.d&&typeof m.d==="object"){S=m.d;if(S.round!==lastRound){lastRound=S.round;myPick=null}draw()}
}
async function hostGame(){
  const cfg=getCfg();msg="";role="h";solo=false;S=base(cfg);used=[];offerLink="";netMsg="جاري تحضير الرابط…";
  try{pc=new RTCPeerConnection(ICE);dc=pc.createDataChannel("g");wire();draw();
    await pc.setLocalDescription(await pc.createOffer());await ice(pc);
    offerLink=location.href.split("#")[0]+"#o="+await enc(pc.localDescription);netMsg=""}
  catch(e){msg="متصفحك ما يدعم الاتصال المباشر";return menu()}
  clearInterval(bcT);bcT=setInterval(bc,1000);draw();
}
async function acceptAns(){
  const m=(document.getElementById("an").value||"").match(/[zp][A-Za-z0-9_-]{60,}/);
  if(!m){netMsg="الرد مو صحيح، الصقه كامل";return draw()}
  try{await pc.setRemoteDescription(await dec(m[0]));netMsg="جاري الاتصال…"}catch(e){netMsg="الرد مو صحيح أو انتهت صلاحيته"}
  draw();
}
async function joinGame(){
  myName=(document.getElementById("nm").value||"").trim()||"لاعب";msg="";
  const m=(document.getElementById("oc").value||"").match(/[zp][A-Za-z0-9_-]{60,}/);
  if(!m){msg="الصق رابط أو كود صديقك";return menu()}
  role="g";solo=false;S=null;netMsg="";
  try{pc=new RTCPeerConnection(ICE);pc.ondatachannel=e=>{dc=e.channel;wire();if(dc.readyState==="open")dc.onopen()};
    await pc.setRemoteDescription(await dec(m[0]));await pc.setLocalDescription(await pc.createAnswer());await ice(pc);
    ansTxt=await enc(pc.localDescription)}
  catch(e){msg="الكود غير صحيح";return menu()}
  guestScreen();
}
function guestScreen(){
  $.innerHTML=`<h1>🚩</h1><p class="sub">${esc(netMsg||"خطوة أخيرة")}</p><div class="card"><p>انسخ هذا الرد وارسله لصاحب السيرفر:</p><textarea id="ac" readonly onclick="this.select()">${esc(ansTxt)}</textarea><button onclick="shareTxt('ac')">📤 ارسل الرد</button><div id="cp" class="c mut"></div><p class="mut">لما صاحب السيرفر يلصقه عنده، تبدي اللعبة تلقائياً.</p></div><button class="alt" onclick="leave()">رجوع</button>`;
}
async function shareTxt(id){
  const el=document.getElementById(id);const txt=(id==="lk"?"تعال العب وياي تحدي الأعلام 🚩\n":"رد التحدي:\n")+el.value;
  try{if(navigator.share){await navigator.share({text:txt});return}}catch(e){if(e&&e.name==="AbortError")return}
  const cp=document.getElementById("cp");
  try{await navigator.clipboard.writeText(txt);if(cp)cp.textContent="تم النسخ ✅ الصقه بالواتساب"}catch(e){el.focus();el.select();if(cp)cp.textContent="انسخ من الخانة فوق"}
}
function leave(){clearInterval(tick);clearInterval(bcT);try{dc&&dc.close()}catch(e){}try{pc&&pc.close()}catch(e){}dc=pc=null;S=null;menu()}
function pick(){let c;do{c=QC[Math.floor(Math.random()*QC.length)]}while(used.includes(c)&&used.length<QC.length);used.push(c);return c}
function nextQ(){
  const c=pick();const o=[c];
  (GR.find(a=>a.includes(c))||[]).filter(x=>x!==c).sort(()=>Math.random()-.5).slice(0,2).forEach(x=>o.push(x));
  while(o.length<4){const x=CODES[Math.floor(Math.random()*CODES.length)];if(!o.includes(x))o.push(x)}
  o.sort(()=>Math.random()-.5);
  S.round++;S.ph="q";S.q={c,o};S.left=TIME;S.ans={};S.res=null;A={};T0=Date.now();myPick=null;lastRound=S.round;
  clearInterval(tick);tick=setInterval(()=>{S.left--;if(S.left<=0)reveal();else{bc();draw()}},1000);
  bc();draw();
}
function onAns(w,c,r){
  if(!S||S.ph!=="q"||r!==S.round||A[w]||!S.P[w])return;
  A[w]={c,t:Date.now()-T0};S.ans[w]=1;
  if(Object.keys(S.P).every(k=>A[k]))reveal();else{bc();draw()}
}
function mine(c){if(role==="g"){if(myPick)return;myPick=c;draw();send("ans",{r:S.round,c})}else{myPick=c;onAns("h",c,S.round)}}
function reveal(){
  clearInterval(tick);const ks=Object.keys(S.P),right=S.q.c;
  const ok=ks.filter(k=>A[k]&&A[k].c===right);
  S.res={};
  ks.forEach(k=>{let g=0;if(ok.includes(k)){g=10;if(ok.length>1&&ok.every(o=>o===k||A[k].t<A[o].t))g+=5}
    S.P[k].score+=g;S.res[k]={c:A[k]?A[k].c:null,g}});
  S.ph="r";
  const top=Math.max(...ks.map(k=>S.P[k].score));
  const over=S.mode==="pts"?top>=S.target:S.round>=S.target;
  bc();draw();
  setTimeout(()=>{if(!S||S.ph!=="r")return;if(over)finish();else nextQ()},3500);
}
function finish(){
  const ks=Object.keys(S.P);let w="draw";
  if(ks.length===1)w="h";else if(S.P.h.score>S.P.g.score)w="h";else if(S.P.g.score>S.P.h.score)w="g";
  S.ph="e";S.winner=w;bc();draw();
}
function again(){Object.values(S.P).forEach(p=>p.score=0);S.round=0;used=[];nextQ()}
function draw(){
  if(!S)return;
  const ks=Object.keys(S.P);
  const sc=`<div class="card"><div class="sc">${ks.map(k=>`<div class="pl ${k===role?"me":""}"><span>${esc(S.P[k].name)}${k===role?" (أنت)":""}</span><b>${S.P[k].score}</b></div>`).join("")}</div>
  <div class="info" style="margin-top:8px"><span>${S.ph==="lobby"?"":"جولة "+S.round+(S.mode==="rd"?" / "+S.target:"")}</span><span>${S.mode==="pts"?"الهدف: "+S.target+" نقطة":S.target+" محاولات"}</span></div></div>`;
  let h="";
  if(S.ph==="lobby"){
    h=`<div class="card c">${role==="h"&&!solo?`<p class="mut">1) ارسل هذا الرابط لصديقك:</p>${offerLink?`<textarea id="lk" readonly onclick="this.select()">${esc(offerLink)}</textarea><button onclick="shareTxt('lk')">📤 دز الرابط لصديقك</button><div id="cp" class="c mut"></div><p class="mut">2) صديقك يرسلك رد، الصقه هنا:</p><textarea id="an" placeholder="الصق رد صديقك"></textarea><button class="alt" onclick="acceptAns()">اتصال</button>`:""}<div class="c mut">${esc(netMsg)}</div>`:""}
    <div>${ks.map(k=>`<div>✅ ${esc(S.P[k].name)}</div>`).join("")}${ks.length<2?'<div class="mut">بانتظار اللاعب الثاني…</div>':""}</div>
    ${role==="h"?`<button onclick="nextQ()" ${ks.length<2?"disabled":""}>ابدأ التحدي</button>`:'<p class="mut">بانتظار صاحب السيرفر يبدأ…</p>'}</div>`;
  }else if(S.ph==="q"||S.ph==="r"){
    const r=S.ph==="r",q=S.q,mp=role==="g"?myPick:(S.res?S.res[role].c:myPick);
    const my=r?(S.res[role]||{}).c:myPick;
    h=`<div class="card"><div class="info"><span>${r?"النتيجة":"⏱ "+S.left+" ث"}</span><span>${!r&&S.ans[role]?"جاوبت ✔":""}</span></div><div class="flag">${fl(q.c)}</div>
    ${q.o.map(c=>{let cl="opt";if(r){if(c===q.c)cl+=" ok";else if(c===my)cl+=" no"}else if(c===my)cl+=" pk";
      return `<button class="${cl}" ${r||myPick?"disabled":""} onclick="mine('${c}')">${esc(NAME[c])}</button>`}).join("")}
    ${r?`<div class="c" style="margin-top:8px">${ks.map(k=>`<div>${esc(S.P[k].name)}: ${S.res[k].c?esc(NAME[S.res[k].c]):"ما جاوب"} <b style="color:${S.res[k].g?"var(--ok)":"var(--no)"}">+${S.res[k].g}</b></div>`).join("")}</div>`:(!S.ans[role]||ks.length<2?"":"")+(S.ans[role]&&ks.length>1?'<p class="c mut">بانتظار الخصم…</p>':"")}</div>`;
  }else{
    const w=S.winner;let t=w==="draw"?"🤝 تعادل!":ks.length===1?"🎉 خلصت! نتيجتك "+S.P.h.score:(w===role?"🏆 فزت!":"😅 خسرت، فاز "+esc(S.P[w].name));
    h=`<div class="card"><div class="big">${t}</div>${role==="h"?'<button onclick="again()">جولة ثانية</button>':'<p class="c mut">بانتظار صاحب السيرفر…</p>'}<button class="alt" onclick="leave()">القائمة الرئيسية</button></div>`;
  }
  $.innerHTML=`<h1>🚩 تحدي الأعلام</h1>`+sc+h+(S.ph!=="e"?`<button class="alt" onclick="exitTap()">${S.ph!=="lobby"&&Date.now()-exitT<3000?"اضغط مرة ثانية للتأكيد":"خروج"}</button>`:"");
}
menu();
</script>
